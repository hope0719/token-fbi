name: Sync AI activity radar data

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ai-pick
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh data and validate production build
        run: |
          python3 scripts/sync_ai_pick.py
          python3 build.py
          git diff --check
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- ai-pick/data.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-pick/data.json
          git commit -m 'data: sync AI activity radar snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
